<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Understanding JavaScript's Capture</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body class="bod">

  <div class="one">
    <div class="two">
      <div class="three">
      </div>
    </div>
  </div>

<style>
  html {
    box-sizing: border-box;
  }

  *, *:before, *:after {
    box-sizing: inherit;
  }

  div {
    width: 100%;
    padding: 100px;
  }

  .one {
    background: thistle;
  }

  .two {
    background: mistyrose;
  }

  .three {
    background: coral;
  }
</style>

<button></button>
<script>
  const divs = document.querySelectorAll('div');
  const button = document.querySelector('button');

  function logText(e){
    console.log(this.classList.value);
    // e.stopPropagation(); // stopPropagation prevents bubbling after first log
    // stopPropagation will also prevent further captures too if u change capture to true
    // console.log(this);
  }

  divs.forEach(div => div.addEventListener('click', logText, {
    // you can add a THIRD event listener argument (options) weird
    // capture can flip the direction (catches it on the way down instead of up)
    // capture: true
    // default is false:
    capture: false,
    once: true // listen for a click, and then UNBIND itself ( or div.removeEventListener)
    // this could be cool if u dont want it to keep running each time it happens kinda vibe
  }));

  button.addEventListener('click', ()=>{
    console.log('clickeroooni my hooomie')
  })

</script>
</body>
</html>

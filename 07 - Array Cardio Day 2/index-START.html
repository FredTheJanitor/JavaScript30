<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 },
      { name: 'Aaron', year: 666},
      { name: 'Caden', year: 2007},
      { name: 'Aiden', year: 2006},
      { name: 'Sophia', year: 2008},
      { name: 'Emma', year: 2007},
      { name: 'Ava', year: 2009}
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 }
    ];

    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?
    // // so make a variable to hold a some function across some data
    // const isAdult = people.some(function(person) {
    //   // this current year thing is just how u get current date in js
    //   const currentYear = (new Date()).getFullYear();
    //   // this is an if statement that says current year - birth year = age basically and
    //   // that age has to be >= 19 for them to be considered an adult
    //   if((currentYear - (person.year))>=19){
    //     // returning true here
    //     return true;
    //   }
    // });

    // here is the simplified version of writing this: lets keep it this level for now
    const isAdult = people.some(person=> {
      const currentYear = (new Date()).getFullYear();
      return ((currentYear - person.year) >=19)
    });
    // // clever way to make it a one-liner is just replacing currentYear with the calculation
    // const isAdult = people.some(person=>(((new Date()).getFullYear())-person.year)>=19);

    // curly brackets here will show name AND boolean, making .some a bit more useful (if u ask me)
    console.log({isAdult});
    // Array.prototype.every() // is everyone 19 or older?

    const allAdults = people.every(person=> {
      const currentYear = (new Date()).getFullYear();
      return ((currentYear - person.year) >=19)
    });
    console.log({allAdults});
    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423
    const comment = comments.find((comment)=>(comment.id === 823423));
    console.log(comment);

    // Array.prototype.findIndex()
    const index = comments.findIndex((comment)=>(comment.id === 823423));
    console.log(index);
    // Find the comment with this ID
    // delete the comment with the ID of 823423
    const newArray = [
      ...comments.slice(0,index),
      ...comments.slice(index + 1)

    ];
    console.table(newArray);

  </script>
</body>
</html>
